<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplication Bingo Game • Scoreboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="scoreboard">
  <div class="page">
    <div class="brand">
      <h1 class="title" data-i18n="page_scoreboard">Scoreboard</h1>
      <p class="subtitle" data-i18n="top_scores">Top scores (last 10 entries)</p>

      <div class="lang-switch" aria-label="Language switch">
        <label for="langSelect" data-i18n="language_label">Language</label>
        <select id="langSelect">
          <option value="en-GB">English (UK)</option>
          <option value="zh-CN">中文 (简体)</option>
        </select>
      </div>
    </div>

    <div class="card card-lg" style="width:min(820px,100%);">
      <div class="filters">
        <input type="text" id="searchPlayer" data-i18n-placeholder="search_player" placeholder="Search player" oninput="filterScores()">
        <select id="tableFilter" data-fill-tables onchange="filterScores()"></select>
      </div>

      <table id="scoreboardTable"></table>

      <div class="footer-actions" style="margin-top:16px;">
        <button class="btn btn-ghost" onclick="window.location.href='menu.html'" data-i18n="back_to_menu">Back to menu</button>
        <button class="btn btn-success" onclick="window.location.href='history.html'" data-i18n="game_history">Game history</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    function headerRow() {
      const t = window.i18n?.t || ((k) => k);
      return `<tr>
        <th>${t('rank')}</th>
        <th>${t('player')}</th>
        <th>${t('score')}</th>
        <th>${t('times_table')}</th>
      </tr>`;
    }

    function formatTimesTable(value) {
      const t = window.i18n?.t || ((k) => k);
      const lang = window.i18n?.getLang ? window.i18n.getLang() : 'en-GB';
      const v = String(value ?? '').trim();

      if (v.startsWith('mixed:')) {
        const nums = v.replace('mixed:', '').split(',').map(s => parseInt(s,10)).filter(n => !Number.isNaN(n));
        const joiner = (lang === 'zh-CN') ? '、' : ', ';
        const tablesStr = nums.map(n => '×' + n).join(joiner);
        return (lang === 'zh-CN') ? `${t('mixed_tables')}（${tablesStr}）` : `${t('mixed_tables')} (${tablesStr})`;
      }

      const n = parseInt(v, 10);
      if (!Number.isNaN(n) && n >= 2 && n <= 9) return t('times_table_n', { n });
      return t('unknown');
    }

    function getAllScores() {
      const scores = JSON.parse(localStorage.getItem('scores')) || [];
      const allScores = [];
      scores.forEach(entry => {
        allScores.push({ player: entry.player1, score: entry.score1, timesTable: entry.timesTable });
        allScores.push({ player: entry.player2, score: entry.score2, timesTable: entry.timesTable });
      });
      allScores.sort((a, b) => b.score - a.score);
      return allScores;
    }

    function displayScores(list) {
      const table = document.getElementById('scoreboardTable');
      table.innerHTML = headerRow();
      (list || []).slice(0, 10).forEach((entry, index) => {
        table.innerHTML += `<tr>
          <td>${index + 1}</td>
          <td>${entry.player}</td>
          <td>${entry.score}</td>
          <td>${formatTimesTable(entry.timesTable)}</td>
        </tr>`;
      });
    }

    function filterScores() {
      const search = document.getElementById('searchPlayer').value.toLowerCase();
      const filter = document.getElementById('tableFilter').value;
      const all = getAllScores();

      const filtered = all.filter(entry =>
        (filter === 'all' || (filter === 'mixed' ? String(entry.timesTable).startsWith('mixed:') : String(entry.timesTable) === String(filter))) &&
        (search === '' || entry.player.toLowerCase().includes(search))
      );

      displayScores(filtered);
    }

    document.addEventListener('DOMContentLoaded', () => {
      displayScores(getAllScores());

      const langSelect = document.getElementById('langSelect');
      if (langSelect) {
        langSelect.addEventListener('change', () => {
          setTimeout(() => filterScores(), 0);
        });
      }
    });
  </script>
</body>
</html>
